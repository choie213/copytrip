name: Apply COPYTRIP PWA icon
on:
  push:
    branches: [copytrip-pwa-icon]
    paths: ['.github/workflows/apply-copytrip-icon.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Pillow
        run: python -m pip install --quiet Pillow
      - name: Generate PWA icons from approved artwork
        run: |
          python - <<'PY'
          import base64, io
          from pathlib import Path
          from PIL import Image
          raw = base64.b64decode('')
          source = Image.open(io.BytesIO(raw)).convert('RGB')
          bg = source.getpixel((0,0))
          for slug in ['2026-11-fukuoka','2026-10-hiroshima']:
              folder = Path(slug)
              for size in (180,192,512):
                  source.resize((size,size),Image.Resampling.LANCZOS).save(folder / ('icon-'+str(size)+'.png'), format='PNG')
              safe = Image.new('RGB',(512,512),bg)
              safe.paste(source.resize((410,410),Image.Resampling.LANCZOS),(51,51))
              safe.save(folder / 'icon-maskable-512.png', format='PNG')
          PY
      - name: Commit icon files only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 2026-11-fukuoka/icon-180.png 2026-11-fukuoka/icon-192.png 2026-11-fukuoka/icon-512.png 2026-11-fukuoka/icon-maskable-512.png 2026-10-hiroshima/icon-180.png 2026-10-hiroshima/icon-192.png 2026-10-hiroshima/icon-512.png 2026-10-hiroshima/icon-maskable-512.png
          git rm .github/workflows/apply-copytrip-icon.yml
          git commit -m 'Apply approved COPYTRIP PWA icon to both trips'
          git push
