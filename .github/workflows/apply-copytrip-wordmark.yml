name: Generate COPYTRIP home-screen icons
on:
  push:
    branches: [copytrip-inline-details-and-brand-icon]
    paths:
      - .github/workflows/apply-copytrip-wordmark.yml
permissions:
  contents: write
jobs:
  render-icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: copytrip-inline-details-and-brand-icon
      - name: Install rasterization packages
        run: python -m pip install --quiet cairosvg Pillow
      - name: Render approved logo for root and both installed trips
        run: |
          python - <<'PY'
          from pathlib import Path
          from io import BytesIO
          import cairosvg
          from PIL import Image
          svg = Path('icon.svg').read_bytes()
          folders = [Path('.'), Path('2026-11-fukuoka'), Path('2026-10-hiroshima')]
          for folder in folders:
              folder.mkdir(parents=True, exist_ok=True)
              (folder / 'icon.svg').write_bytes(svg)
              for size in (180, 192, 512):
                  png = cairosvg.svg2png(bytestring=svg, output_width=size, output_height=size)
                  im = Image.open(BytesIO(png)).convert('RGB')
                  im.save(folder / f'copytrip-icon-{size}.png', format='PNG', optimize=True)
              png = cairosvg.svg2png(bytestring=svg, output_width=384, output_height=384)
              safe = Image.new('RGB', (512, 512), (253, 252, 248))
              safe.paste(Image.open(BytesIO(png)).convert('RGB'), (64, 64))
              safe.save(folder / 'copytrip-icon-maskable-512.png', format='PNG', optimize=True)
          PY
      - name: Commit only icon files and remove temporary generator
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add icon.svg copytrip-icon-*.png 2026-11-fukuoka/icon.svg 2026-11-fukuoka/copytrip-icon-*.png 2026-10-hiroshima/icon.svg 2026-10-hiroshima/copytrip-icon-*.png
          git rm .github/workflows/apply-copytrip-wordmark.yml
          git commit -m "Render COPYTRIP PWA wordmark for every entry point"
          git push origin HEAD:copytrip-inline-details-and-brand-icon
