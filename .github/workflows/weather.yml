name: weather

# All forecast writes go to weather-data, not the GitHub Pages deployment branch.
# App commits never launch a competing weather workflow.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  update:
    runs-on: ubuntu-latest
    concurrency:
      group: weather-update
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Load last forecast snapshot from weather-data
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin weather-data
          while IFS= read -r path; do
            mkdir -p "$(dirname "$path")"
            git show "origin/weather-data:$path" > "$path"
          done < <(git ls-tree -r --name-only origin/weather-data -- data | grep '/weather.json$' || true)
      - name: Calculate forecasts based on latest main plans
        run: python .github/scripts/weather.py
      - name: Publish forecasts only to weather-data branch
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach "$RUNNER_TEMP/weather-data" origin/weather-data
          while IFS= read -r -d '' path; do
            mkdir -p "$RUNNER_TEMP/weather-data/$(dirname "$path")"
            cp "$path" "$RUNNER_TEMP/weather-data/$path"
          done < <(find data -type f -name 'weather.json' -print0)
          cd "$RUNNER_TEMP/weather-data"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data
          if ! git diff --cached --quiet; then
            git commit -m "날씨 데이터 갱신"
            git push origin HEAD:weather-data
          fi

  # Additional dispatch because cron can be delayed; only one pending run is kept.
  next:
    needs: update
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 70
    concurrency:
      group: weather-next
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            data/trips.json
            data/*/plan.json
          sparse-checkout-cone-mode: false
      - run: sleep 3540
      - name: dispatch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for SLUG in $(jq -r '.[].slug' data/trips.json); do
            TRIP_TZ=$(jq -r '.trip.timezone' "data/$SLUG/plan.json")
            FIRST_DAY=$(jq -r '.days[0].date | gsub("-"; "")' "data/$SLUG/plan.json")
            LAST_DAY=$(jq -r '.days[-1].date | gsub("-"; "")' "data/$SLUG/plan.json")
            if [ "$(TZ=$TRIP_TZ date +%Y%m%d)" -le "$LAST_DAY" ] && [ "$(TZ=$TRIP_TZ date -d '+15 days' +%Y%m%d)" -ge "$FIRST_DAY" ]; then
              gh workflow run weather.yml --repo "$GITHUB_REPOSITORY" --ref main
              break
            fi
          done
